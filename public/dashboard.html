<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dashboard</title><link rel="stylesheet" href="/style.css"></head><body><header><strong>⚡ ScanClick Dashboard</strong><a href="/">หน้าหลัก</a></header><main class="panel"><h1>ทดสอบระบบ Chat</h1><label>API Key <input id="key" placeholder="sc_..."></label><label>ข้อความ <textarea id="prompt" placeholder="พิมพ์ข้อความ"></textarea></label><button class="button" onclick="send()">ส่งข้อความ</button><pre id="out">ผลลัพธ์จะแสดงที่นี่</pre></main><script>async function send(){const out=document.querySelector('#out');out.textContent='กำลังประมวลผล...';try{const r=await fetch('/api/v1/chat/completions',{method:'POST',headers:{'Content-Type':'application/json','x-api-key':document.querySelector('#key').value},body:JSON.stringify({prompt:document.querySelector('#prompt').value})});out.textContent=JSON.stringify(await r.json(),null,2)}catch(e){out.textContent=e.message}}</script></body></html>
