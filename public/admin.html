<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin</title><link rel="stylesheet" href="/style.css"></head><body><header><strong>⚡ ScanClick Admin</strong><a href="/">หน้าหลัก</a></header><main class="panel"><h1>ผู้ใช้ในระบบ</h1><input id="key" placeholder="ADMIN_KEY"><button class="button" onclick="loadUsers()">โหลดข้อมูล</button><pre id="out"></pre></main><script>async function loadUsers(){const r=await fetch('/api/v1/users',{headers:{'x-admin-key':document.querySelector('#key').value}});document.querySelector('#out').textContent=JSON.stringify(await r.json(),null,2)}</script></body></html>
